name: "🇮🇹 Proposta di funzionalità"
description: Proponi un miglioramento
title: "[Funzionalità]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Che cosa vorresti che facesse l’app?
      description: Quale problema risolverebbe?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Come immagini che funzioni?
      description: È sufficiente una descrizione generale.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Hai già provato un altro modo per risolvere il problema?
