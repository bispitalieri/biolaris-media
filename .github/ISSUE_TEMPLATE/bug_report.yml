name: "🇬🇧 Bug report"
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Do not attach private media or sensitive information."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Biolaris Media version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Remove personal file paths and sensitive information before sharing.
