name: "🇮🇹 Segnalazione bug"
description: Segnala un problema riproducibile
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Prima di segnalare il bug, controlla che nessuno l’abbia già fatto. Non allegare file media personali o informazioni private."
  - type: textarea
    id: description
    attributes:
      label: Che cosa è successo?
      description: Che cosa stavi facendo e che cosa ti aspettavi?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Come possiamo riprodurlo?
      placeholder: "1. Apri ...\n2. Scegli ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versione di Biolaris Media
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Sistema operativo e versione
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Messaggio di errore o log (facoltativo)
      description: Se condividi un log, rimuovi prima percorsi personali e informazioni private.
