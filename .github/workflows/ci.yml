name: Build (main and pull requests)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: biolaris-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  desktop-build:
    name: Tauri build (${{ matrix.platform }})
    env:
      BIOLARIS_RUNTIME_REPOSITORY: bispitalieri/biolaris-runtime
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macOS ARM64
            os: macos-26
            target: aarch64-apple-darwin
          - platform: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set Default Windows Toolchain (MSVC)
        if: runner.os == 'Windows'
        run: rustup default stable-x86_64-pc-windows-msvc

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - run: npm ci

      - name: Build Tauri application
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: biolaris-${{ matrix.platform }}
          path: |
            # Linux
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.AppImage.sig
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm

            # Windows
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.exe.sig
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.msi.sig

            # macOS
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.app.tar.gz.sig
            src-tauri/target/**/release/bundle/**/*.app.zip.gz
            src-tauri/target/**/release/bundle/**/*.app.zip.gz.sig
          if-no-files-found: error
          retention-days: 30
