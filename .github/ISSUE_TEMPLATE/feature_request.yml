name: "🇬🇧 Feature request"
description: Suggest an improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like the app to do?
      description: What problem would this solve for you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How do you imagine it working?
      description: A rough description is enough.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Have you tried another way to solve this?
