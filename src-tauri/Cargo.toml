[package]
name = "biolaris_media"
version = "0.1.2"
license = "AGPL-3.0-only"
description = "Local media conversion and compression suite"
authors = ["Biolaris contributors"]
edition = "2021"

[lib]
name = "biolaris_media_lib"
# Tauri desktop builds only need the DLL and the rlib. Keeping a staticlib in the
# same crate emits a massive PE export table on MinGW, which can overflow the
# Windows linker limit ("export ordinal too large").
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
tokio = { version = "1", features = ["sync", "time"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
ico = "0.6"
num_cpus = "1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
vtracer = "0.6.5"
lopdf = { version = "0.46", default-features = false }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
