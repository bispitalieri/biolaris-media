name: "🇬🇧 Bug report"
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Before you report a bug, check whether someone has already raised it. Please do not attach personal media or private information."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What were you trying to do, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      placeholder: "1. Open ...\n2. Choose ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Biolaris Media version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or log (optional)
      description: If you share a log, remove personal file paths and private information first.
