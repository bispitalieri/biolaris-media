name: CI (main and pull requests)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: biolaris-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Restore npm cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}

      - run: npm ci --prefer-offline

      - name: Save npm cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}

      - run: npm run build

  rust-cache:
    name: Warm Rust cache (${{ matrix.platform }})
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

          - platform: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc

          - platform: macOS ARM64
            os: macos-26
            target: aarch64-apple-darwin

          - platform: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set Default Windows Toolchain (MSVC)
        if: runner.os == 'Windows'
        run: rustup default stable-x86_64-pc-windows-msvc

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.target }}
          cache-targets: true
          cache-on-failure: true

      - name: Prepare temporary runtime placeholder
        shell: bash
        run: |
          mkdir -p src-tauri/binaries/runtime-current
          touch src-tauri/binaries/runtime-current/.cache-placeholder

      - name: Warm Rust release dependencies
        working-directory: src-tauri
        run: cargo build --release --locked --target ${{ matrix.target }}
