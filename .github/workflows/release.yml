name: Release

on:
  push:
    tags: [ "v*" ]

concurrency:
  group: biolaris-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  ci-gate:
    name: Wait for CI on tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Wait for matching CI run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 300))

          while (( SECONDS < deadline )); do
            runs="$(gh run list \
              --workflow ci.yml \
              --commit "$TAG_SHA" \
              --json databaseId,status,conclusion,headSha \
              --limit 100)"

            matching_runs="$(jq --arg sha "$TAG_SHA" '[.[] | select(.headSha == $sha)]' <<< "$runs")"

            if jq -e 'any(.[]; .conclusion == "success")' <<< "$matching_runs" >/dev/null; then
              echo "CI succeeded for tagged commit $TAG_SHA."
              exit 0
            fi

            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<< "$matching_runs" >/dev/null; then
              echo "::error::CI completed without a successful run for tagged commit $TAG_SHA."
              jq -r '.[] | "run \(.databaseId): \(.conclusion // .status)"' <<< "$matching_runs"
              exit 1
            fi

            if jq -e 'length > 0' <<< "$matching_runs" >/dev/null; then
              echo "CI for $TAG_SHA is queued or running; checking again in 15 seconds."
            else
              echo "No CI run found yet for $TAG_SHA; checking again in 15 seconds."
            fi

            sleep 15
          done

          echo "::error::No successful CI run appeared for tagged commit $TAG_SHA within 5 minutes."
          exit 1

  validate:
    name: Validate release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci-gate

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Restore npm cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: linux-validation

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - name: Prepare runtime placeholder for Rust validation
        shell: bash
        run: |
          mkdir -p src-tauri/binaries/runtime-current
          touch src-tauri/binaries/runtime-current/.cache-placeholder

      - name: Run Rust clippy
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Validate updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_PLATFORM: macOS
        run: node scripts/validate-updater-config.mjs

      - name: Verify updater signing key and password
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test_file="$(mktemp)"
          trap 'rm -f "$test_file" "$test_file.sig"' EXIT

          printf 'Tauri updater signing preflight\n' > "$test_file"

          ./node_modules/.bin/tauri signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$test_file"

  build:
    name: Release build (${{ matrix.platform }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    permissions:
      contents: write

    env:
      BIOLARIS_RUNTIME_REPOSITORY: bispitalieri/biolaris-runtime
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CARGO_TERM_COLOR: always

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

          - platform: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc

          - platform: macOS ARM64
            os: macos-26
            target: aarch64-apple-darwin

          - platform: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Node dependencies
        run: npm ci --prefer-offline

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set Default Windows Toolchain (MSVC)
        if: runner.os == 'Windows'
        run: rustup default stable-x86_64-pc-windows-msvc

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.target }}
          cache-targets: true

      - name: Download and stage runtime binaries
        run: npm run binaries:download && npm run binaries:stage

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Biolaris Media v__VERSION__"
          releaseDraft: true
          args: --target ${{ matrix.target }}
          releaseAssetNamePattern: "[name]_[version]_[platform]-[arch].[ext]"

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          sed -n "/^## \[${VERSION}\]/,/^## /p" CHANGELOG.md | sed '$d' > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No release notes found for version $VERSION in CHANGELOG.md."
            exit 1
          fi

          echo "Extracted release notes for $VERSION:"
          cat release-notes.md

      - name: Update release with CHANGELOG notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release edit "$RELEASE_VERSION" \
            --draft=false \
            --notes-file release-notes.md
